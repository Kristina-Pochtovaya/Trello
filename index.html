<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/scss/index.scss" />
    <title>Trello</title>
  </head>
  <body>
    <header class="main">
      <div class="container">
        <div class="main__wrapper">
          <div class="logo">
            <i class="fa-brands fa-trello"></i>
            <div class="main__title"><p>Trello</p></div>
          </div>

          <div id="search-input" class="search-input">
            <input
              type="text"
              placeholder="Start to search..."
              maxlength="55"
            />
          </div>

          <div id="timer" class="timer"></div>
        </div>
      </div>
    </header>

    <section class="cards">
        <div class="container">
          <div class="cards__wrapper">
            <div class="cards__column cards__column_todo">
                <div class="cards__header">
                    <div class="header__title">
                        <p>TODO:</p>
                    </div>
                    <div id="count" class="header__count">
                        <p>2</p>
                    </div>
                </div>
                <div id="cards__content" class="cards__content">
                   
                </div>

                <div class="cards__footer">
                    <button id="add_todo">Add todo</button>
                </div>
            </div>

            <div class="cards__column cards__column_in-progress">
                <div class="cards__header">
                    <div class="header__title">
                        <p>IN PROGRESS:</p>
                    </div>
                    <div id="count" class="header__count">
                        <p>1</p>
                    </div>
                </div>
                <div id="cards__content" class="cards__content">
                   
                </div>
            </div>

            <div class="cards__column cards__column_done">
                <div class="cards__header">
                    <div class="header__title">
                        <p>DONE:</p>
                    </div>
                    <div id="count" class="header__count">
                        <p>1</p>
                    </div>
                </div>
                <div id="cards__content" class="cards__content">
                   
                </div>

                <div class="cards__footer">
                    <button id="delete_all">Delete all</button>
                </div>
            </div>
          </div>
        <div>
      </section>
    <script type="module" src="./src/js/index.js"></script>
  </body>
</html>
